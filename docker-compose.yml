version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  cms:
    build:
      context: .
      dockerfile: Dockerfile.cms
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/blog
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-only-not-secret}
      PAYLOAD_API_INTERNAL_URL: http://api:3002
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_API_KEY: ${AI_API_KEY:-}
      RUN_MIGRATION: ${RUN_MIGRATION:-false}
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PAYLOAD_API_URL: http://cms:3001
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      PORT: 3002
    ports:
      - '3002:3002'
    depends_on:
      cms:
        condition: service_started
    volumes:
      - apicache:/repo/apps/api/.cache

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      WEB_API_URL: http://api:3002
      NEXT_PUBLIC_GISCUS_REPO: ${NEXT_PUBLIC_GISCUS_REPO:-}
      NEXT_PUBLIC_GISCUS_REPOSITORY_ID: ${NEXT_PUBLIC_GISCUS_REPOSITORY_ID:-}
      NEXT_PUBLIC_GISCUS_CATEGORY: ${NEXT_PUBLIC_GISCUS_CATEGORY:-}
      NEXT_PUBLIC_GISCUS_CATEGORY_ID: ${NEXT_PUBLIC_GISCUS_CATEGORY_ID:-}
      NEXT_PUBLIC_UMAMI_ID: ${NEXT_PUBLIC_UMAMI_ID:-}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  apicache:
